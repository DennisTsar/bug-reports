name: 'Repro'
on:
  workflow_dispatch: { }
  push:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (from Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: myapp:ci
          load: true              # makes the image available to `docker run`
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run something in the container
        run: |
          docker run --rm myapp:ci java -version
          docker run --rm myapp:ci kobweb --version