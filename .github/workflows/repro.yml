name: 'Repro'
on:
  workflow_dispatch: { }
  push:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          ./gradlew wrapper --gradle-version 7.6.6 && ./gradlew wrapper
          ./gradlew build